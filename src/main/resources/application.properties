spring.application.name=pancardresizerpro
server.tomcat.threads.max=20
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
server.compression.min-response-size=1024

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.url=jdbc:h2:file:./data/filewalaraja-auth-db-v4;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mdsufi}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mdsufi123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.validation.max-kb=50
app.features.enhance-enabled=false
app.cors.allowed-origins=http://localhost:5173,https://pan-resizer-frontend.example.com

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.auth.mock-email=${APP_AUTH_MOCK_EMAIL:false}
app.auth.allow-otp-log-fallback=${APP_AUTH_ALLOW_OTP_LOG_FALLBACK:false}
app.auth.verify-token-minutes=${APP_AUTH_VERIFY_TOKEN_MINUTES:30}
app.auth.session-hours=${APP_AUTH_SESSION_HOURS:48}
app.auth.verification-base-url=${APP_AUTH_VERIFICATION_BASE_URL:http://localhost:5173/auth.html?mode=verify&token=%s}

# Set these in production to enable real email sending
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:sufi111729@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:wntycheikwetkvfn}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_SMTP_SSL_TRUST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=${SPRING_MAIL_DEBUG:false}
